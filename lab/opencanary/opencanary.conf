{
    "device.node_id": "ftp-gw-01",
    "ip.ignorelist": [],
    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "(vsFTPd 3.0.3)",
    "ftp.log_auth_attempt_initiated": true,
    "ftp.honeycreds": [],
    "telnet.enabled": true,
    "telnet.port": 23,
    "telnet.banner": "",
    "telnet.max_connections": 64,
    "telnet.timeout": 120,
    "telnet.honeycreds": [],
    "telnet.log_tcp_connection": true,
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {"format": "%(message)s"}
            },
            "handlers": {
                "console": {"class": "logging.StreamHandler", "stream": "ext://sys.stdout"},
                "file": {"class": "logging.FileHandler", "filename": "/logs/opencanary.json"}
            }
        }
    }
}
