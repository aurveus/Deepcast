# Honeypot lab. Start with ./up.sh (loads ../.env), stop with ./down.sh.
services:
  cowrie:
    image: cowrie/cowrie:3.1.2
    container_name: cowrie
    restart: unless-stopped
    ports:
      # Bound to the VMnet1 host IP only, so the honeypot is never exposed on Wi-Fi/Ethernet.
      - "${HOST_IP}:${COWRIE_SSH_PORT}:2222"
    volumes:
      # Cowrie writes cowrie.json (one JSON event per line) here.
      - ./logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      # Persistent state: SSH host keys (stable identity across restarts), tty recordings, downloads.
      - ./state/cowrie:/cowrie/cowrie-git/var/lib/cowrie
      # Breadcrumbs planted inside the honeypot (hosts file, shell history, arp output): generated by cowrie_custom/build.py
      - ./cowrie_custom/out:/custom:ro
      # Bounded find: the stock one follows symlink loops and froze the single-threaded honeypot (see the header of the file)
      - ./cowrie_custom/commands/find.py:/cowrie/cowrie-git/src/cowrie/commands/find.py:ro
    environment:
      COWRIE_HONEYPOT_CONTENTS_PATH: /custom/honeyfs
      COWRIE_HONEYPOT_TXTCMDS_PATH: /custom/txtcmds
      COWRIE_SHELL_FILESYSTEM: /custom/fs.pickle
    mem_limit: 512m
    cpus: 1.0
    networks:
      - lab

  webadmin:
    build: ./webadmin
    container_name: webadmin
    restart: unless-stopped
    ports:
      - "${HOST_IP}:${WEB_PORT}:8080"
    volumes:
      - ./logs/web:/logs
    mem_limit: 256m
    cpus: 0.5
    networks:
      - lab

  opencanary:
    image: thinkst/opencanary:0.9.10
    container_name: opencanary
    restart: unless-stopped
    ports:
      - "${HOST_IP}:${FTP_PORT}:21"
      - "${HOST_IP}:${TELNET_PORT}:23"
    volumes:
      - ./opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - ./logs/opencanary:/logs
    mem_limit: 256m
    cpus: 0.5
    networks:
      - lab

  smbdecoy:
    build: ./smbdecoy
    container_name: smbdecoy
    restart: unless-stopped
    ports:
      # 445 is taken by Windows' own SMB server, so the decoy is published on a non-standard host port.
      - "${HOST_IP}:${SMB_PORT}:445"
    volumes:
      - ./logs/smb:/logs
    mem_limit: 256m
    cpus: 0.5
    networks:
      - lab

networks:
  lab:
    # Pinned so the Docker relay address (the gateway, .1) is the same on every machine.
    ipam:
      config:
        - subnet: ${DOCKER_LAB_SUBNET}
